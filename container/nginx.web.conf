# Config INTERNA do container web. Sem TLS e sem proxy de /api/ — quem faz isso
# e o proxy reverso da VPS, que roteia direto para bi-margem-lucro-api:8000.

server {
    listen 80;
    server_name _;

    client_max_body_size 400m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Estaticos do Django (admin/DRF), vindos do volume compartilhado com a API.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
    }

    # Assets versionados do build do Vite.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA: qualquer rota nao resolvida cai no index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
