# Ambiente de DESENVOLVIMENTO e execucao dos testes.
# Producao usa container/docker-compose.vps.yml — nunca este arquivo.
#
#   docker compose --env-file container/.env.dev -f container/docker-compose.dev.yml up -d --build
#   docker compose --env-file container/.env.dev -f container/docker-compose.dev.yml exec bi-margem-lucro-api pytest
#
# Ou simplesmente `make dev`.

name: bi-margem-lucro-dev

services:
  bi-margem-lucro-db:
    image: postgres:18
    container_name: bi-margem-lucro-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_margem
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
    ports:
      # Publicada para inspecao externa (DBeaver, psql). Em producao NAO se publica.
      # 5433 no host para nao conflitar com um Postgres ja instalado na maquina.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      # PG18 mudou a convencao: o mount vai em /var/lib/postgresql e a imagem cria
      # o subdiretorio da versao. Montar em /data faz o container abortar.
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi_margem"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      internal-services:
        aliases:
          - bi-margem-lucro-db

  bi-margem-lucro-api:
    image: bi-margem-lucro-api:dev
    build:
      context: ..
      dockerfile: container/api.Dockerfile
      target: dev
    container_name: bi-margem-lucro-api-dev
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DEBUG: "1"
      SECRET_KEY: chave-alterada-para-padrao
      ALLOWED_HOSTS: localhost,127.0.0.1,bi-margem-lucro-api,${DEV_HOST_IP:-localhost}
      POSTGRES_HOST: bi-margem-lucro-db
      POSTGRES_DB: bi_margem
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_HOST_PORT:-5173},http://${DEV_HOST_IP:-localhost}:${WEB_HOST_PORT:-5173}
      LOG_LEVEL: DEBUG
    volumes:
      - ..:/app
      # CSVs reais montados somente-leitura: o ETL roda contra os dados de verdade
      - ../data/dados/usarei:/app/data/dados/usarei:ro
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      bi-margem-lucro-db:
        condition: service_healthy
    networks:
      internal-services:
        aliases:
          - bi-margem-lucro-api

  bi-margem-lucro-web:
    image: bi-margem-lucro-web:dev
    build:
      context: ..
      dockerfile: container/web.Dockerfile
      target: development
    container_name: bi-margem-lucro-web-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://${DEV_HOST_IP:-localhost}:${API_HOST_PORT:-8000}/api/v1
    volumes:
      - ../frontend:/app
      # Preserva o node_modules instalado na imagem, que o bind mount cobriria.
      - node_modules_dev:/app/node_modules
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    networks:
      - internal-services

  # E2E com prints (Playwright). So sobe sob demanda: `make e2e`.
  # A imagem oficial fixa navegador e fontes — o baseline de imagem so e
  bi-margem-lucro-e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: bi-margem-lucro-e2e-dev
    profiles: ["e2e"]
    working_dir: /e2e
    ipc: host
    environment:
      E2E_WEB_URL: http://bi-margem-lucro-web:5173
      E2E_API_URL: http://bi-margem-lucro-api:8000
      E2E_USUARIO: ${E2E_USUARIO:-admin}
      E2E_SENHA: ${E2E_SENHA:-mbcti123}
    volumes:
      - ../e2e:/e2e
      - node_modules_e2e:/e2e/node_modules
    entrypoint: ["sh", "-c", "npm install --no-audit --no-fund --silent && npx playwright test \"$$@\"; status=$$?; chown -R 1000:1000 /e2e/testes /e2e/resultados /e2e/relatorio /e2e/.auth 2>/dev/null; exit $$status", "--"]
    depends_on:
      - bi-margem-lucro-web
      - bi-margem-lucro-api
    networks:
      - internal-services

volumes:
  pgdata_dev:
  node_modules_dev:
  node_modules_e2e:

networks:
  internal-services:
    name: internal-services
    external: false
